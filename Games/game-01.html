<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla JS Tic-Tac-Toe</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-white font-sans flex flex-col items-center justify-center min-h-screen relative">

    <a href="index.html"
        class="absolute top-6 left-4 sm:top-8 sm:left-8 inline-flex items-center px-4 py-2 bg-slate-800 hover:bg-cyan-600 text-slate-300 hover:text-white rounded-lg transition-colors font-medium border border-slate-700 hover:border-cyan-500 shadow-sm group">
        <svg class="w-5 h-5 mr-2 transform group-hover:-translate-x-1 transition-transform" fill="none"
            stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18">
            </path>
        </svg>
        Back to Games
    </a>

    <h1 class="text-4xl font-bold mb-2 text-cyan-400">Tic-Tac-Toe</h1>
    <h3 class="text-lg text-slate-400 mb-8 font-medium">Try to win the game.</h3>
    <!-- Scoreboard -->
    <div
        class="mb-6 flex gap-8 text-lg font-semibold bg-slate-800 px-8 py-4 rounded-2xl shadow-xl border border-slate-700">
        <div class="flex flex-col items-center">
            <span class="text-amber-400 mb-1">You (X)</span>
            <span id="scoreX" class="text-3xl">0</span>
        </div>
        <div class="flex flex-col items-center">
            <span class="text-slate-400 mb-1">Tie</span>
            <span id="scoreTie" class="text-3xl">0</span>
        </div>
        <div class="flex flex-col items-center">
            <span class="text-emerald-400 mb-1">Bot (O)</span>
            <span id="scoreO" class="text-3xl">0</span>
        </div>
    </div>

    <div id="status"
        class="mb-6 text-xl font-medium px-6 py-4 rounded-lg bg-slate-800 shadow-inner text-center min-h-[60px] flex items-center justify-center transition-all">
        Next player: X
    </div>

    <div id="board" class="grid grid-cols-3 gap-2 bg-slate-700 p-2 rounded-xl shadow-2xl">
    </div>

    <button id="resetBtn"
        class="mt-10 px-6 py-2 bg-cyan-600 hover:bg-cyan-500 rounded-full font-semibold transition-colors shadow-lg">
        Restart Game
    </button>

    <script>
        const boardElement = document.getElementById('board');
        const statusElement = document.getElementById('status');
        const resetBtn = document.getElementById('resetBtn');

        let board = Array(9).fill(null);
        let xIsNext = true;
        let winner = null;
        let gameEnded = false;

        let scoreX = 0;
        let scoreO = 0;
        let scoreTie = 0;

        // Winning combinations
        const winningLines = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        function checkWinner(squares = board) {
            for (let line of winningLines) {
                const [a, b, c] = line;
                if (squares[a] && squares[a] === squares[b] && squares[a] === squares[c]) {
                    return { symbol: squares[a], line };
                }
            }
            return null;
        }

        function getAvailableMoves(squares) {
            return squares.map((val, idx) => val === null ? idx : null).filter(val => val !== null);
        }

        function minimax(squares, depth, isMaximizing) {
            let winInfo = checkWinner(squares);
            if (winInfo && winInfo.symbol === 'O') return 10 - depth;
            if (winInfo && winInfo.symbol === 'X') return depth - 10;

            let availableMoves = getAvailableMoves(squares);
            if (availableMoves.length === 0) return 0;

            if (isMaximizing) {
                let bestScore = -Infinity;
                for (let i of availableMoves) {
                    squares[i] = 'O';
                    let score = minimax(squares, depth + 1, false);
                    squares[i] = null;
                    bestScore = Math.max(score, bestScore);
                }
                return bestScore;
            } else {
                let bestScore = Infinity;
                for (let i of availableMoves) {
                    squares[i] = 'X';
                    let score = minimax(squares, depth + 1, true);
                    squares[i] = null;
                    bestScore = Math.min(score, bestScore);
                }
                return bestScore;
            }
        }

        function updateScores() {
            document.getElementById('scoreX').innerText = scoreX;
            document.getElementById('scoreO').innerText = scoreO;
            document.getElementById('scoreTie').innerText = scoreTie;
        }

        function checkGameState() {
            const winInfo = checkWinner();
            if (winInfo) {
                winner = winInfo.symbol;
                gameEnded = true;
                if (winner === 'X') scoreX++;
                else scoreO++;
                updateScores();
            } else if (board.every(Boolean)) {
                gameEnded = true;
                scoreTie++;
                updateScores();
            }
        }

        function makeBotMove() {
            if (gameEnded) return;

            let bestScore = -Infinity;
            let move;
            let availableMoves = getAvailableMoves(board);

            for (let i of availableMoves) {
                board[i] = 'O';
                let score = minimax(board, 0, false);
                board[i] = null;
                if (score > bestScore) {
                    bestScore = score;
                    move = i;
                }
            }

            if (move !== undefined) {
                board[move] = 'O';
                xIsNext = true;

                checkGameState();
                updateUI();
            }
        }

        function updateUI() {
            boardElement.innerHTML = '';
            const winInfo = checkWinner();

            board.forEach((value, i) => {
                const cell = document.createElement('button');
                cell.className = `w-24 h-24 text-4xl font-bold flex items-center justify-center rounded-lg transition-all ${!value ? "bg-slate-800 hover:bg-slate-600" : "bg-slate-700 cursor-default"
                    }`;

                if (value === 'X') cell.classList.add('text-amber-400');
                if (value === 'O') cell.classList.add('text-emerald-400');

                // Highlight winning line
                if (winInfo && winInfo.line.includes(i)) {
                    cell.classList.add('ring-4', 'ring-white', 'scale-105', 'z-10');
                }

                cell.innerText = value || '';
                cell.onclick = () => handleClick(i);
                boardElement.appendChild(cell);
            });

            if (winner) {
                if (winner === 'O') {
                    statusElement.innerHTML = `
                        <div class="flex flex-col items-center gap-3 py-2">
                            <img src="../assets/bot_win.png" alt="Bot Wins" class="w-[200px] h-[200px] object-cover rounded-xl shadow-lg">
                            <span class="text-emerald-400 font-bold text-2xl drop-shadow-md">Bot Wins!</span>
                        </div>
                    `;
                } else {
                    statusElement.innerHTML = `Winner: <span class="text-amber-400 ml-2">You (X)</span>`;
                }
            } else if (gameEnded) {
                statusElement.innerHTML = `
                    <div class="flex flex-col items-center gap-3 py-2">
                        <img src="../assets/tie_lady.png" alt="It's a Tie" class="w-[200px] h-[200px] object-cover rounded-xl shadow-lg">
                        <span class="text-rose-400 font-bold text-2xl drop-shadow-md">It's a Tie!</span>
                    </div>
                `;
            } else {
                statusElement.innerHTML = `Next player: ${xIsNext ? '<span class="text-amber-400 ml-2">X (You)</span>' : '<span class="text-emerald-400 ml-2">O (Bot)</span>'}`;
            }
        }

        function handleClick(i) {
            if (gameEnded || board[i] || !xIsNext) return;

            board[i] = "X";
            xIsNext = false;

            checkGameState();
            updateUI();

            if (!gameEnded) {
                setTimeout(makeBotMove, 400); // Delay for the bot to "think"
            }
        }

        resetBtn.onclick = () => {
            board = Array(9).fill(null);
            xIsNext = true;
            winner = null;
            gameEnded = false;
            updateUI();
        };

        // Initialize the game
        updateUI();
    </script>
</body>

</html>
